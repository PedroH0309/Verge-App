name: Publish Verge Android Preview

on:
  workflow_run:
    workflows: ["Verge Android APK"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve successful Android debug APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          artifact="Verge-Android-debug-$RUN_NUMBER"
          available="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[].name')"
          if ! grep -Fxq "$artifact" <<< "$available"; then
            echo "Only debug APKs are automatically published as public previews."
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
            exit 0
          fi
          gh run download "$RUN_ID" --repo "$REPOSITORY" --name "$artifact" --dir release-files
          test -f release-files/Verge-Android-TEST-debug.apk
          test -f release-files/SHA256SUMS.txt
          (cd release-files && sha256sum -c SHA256SUMS.txt)

      - name: Publish experimental Android preview on GitHub Releases
        if: env.SKIP_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag="android-preview-$RUN_NUMBER"
          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Android preview already published."
            exit 0
          fi
          cat > notes.md <<'EOF'
          ## Verge Android Preview

          Experimental GPLv3-derived Android APK with original Verge branding and offline profile avatars.

          **Debug-signed build for testing, not a verified commercial release.**
          Upgrades across debug builds may require uninstalling and can erase local application data. Before sharing, test installation, playback, profiles and library on a physical Android device.

          - Verge-Android-TEST-debug.apk — Android test package
          - SHA256SUMS.txt — integrity checksum

          Corresponding GPLv3 source code: https://github.com/PedroH0309/Verge-App
          EOF
          gh release create "$tag" release-files/Verge-Android-TEST-debug.apk \
            release-files/SHA256SUMS.txt \
            --repo "$REPOSITORY" \
            --title "Verge Android Preview #$RUN_NUMBER" \
            --notes-file notes.md \
            --target "$SOURCE_COMMIT" \
            --prerelease \
            --latest=false
